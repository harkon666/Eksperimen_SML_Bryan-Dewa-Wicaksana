name: Automated Data Preprocessing Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run Automated Preprocessing
        run: |
          python preprocessing/automate_Bryan-Dewa-Wicaksana.py

      - name: Upload Processed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-heart-dataset
          path: preprocessing/dataset_preprocessing/heart_processed.csv
